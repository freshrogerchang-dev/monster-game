<!doctype html>
<html lang="zh-Hant" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07131b">
  <meta name="google" content="notranslate">
  <meta name="format-detection" content="telephone=no">
  <title>冰水特攻隊 3D</title>
  <link rel="stylesheet" href="styles.css?v=flame1">
</head>
<body class="notranslate">
  <main id="gameShell">
    <canvas id="game" aria-label="3D 第一人稱水槍射擊遊戲"></canvas>
    <header class="hud" aria-label="遊戲狀態">
      <div class="health-wrap"><span>生命</span><div class="health-track"><i id="healthBar"></i></div><strong id="healthText">100</strong></div>
      <div id="modeBadge" class="mode-badge">選擇版本</div>
      <div class="score"><span>分數</span><strong id="score">0</strong><button id="muteButton" class="mute" type="button">🔊</button></div>
    </header>
    <div id="levelInfo" class="level-info"></div>
    <div class="effect shield-fx" aria-hidden="true"></div>
    <div class="effect stop-fx" aria-hidden="true"></div>
    <div class="crosshair" aria-hidden="true"><i></i><i></i></div>
    <div id="powerUp" class="power-up" aria-live="polite"></div>
    <div id="freezeMeter" class="freeze-meter" aria-hidden="true"><i></i></div>
    <div id="filmFx" class="film-fx" aria-hidden="true"></div>
    <div id="hitFlash" class="hit-flash"></div>
    <div id="message" class="message" aria-live="polite"></div>
    <section id="startPanel" class="panel">
      <p class="eyebrow">3D WATER BLASTER</p>
      <h1>冰水特攻隊</h1>
      <p id="panelText">選擇適合你的版本。兩種版本都能轉動手機瞄準、按住畫面噴水。</p>
      <div class="mode-options">
        <button class="mode-button child" data-mode="child"><b>🌈 小孩版</b><span>可愛怪物・慢速・低傷害</span></button>
        <button class="mode-button adult" data-mode="adult"><b>🌙 成人版</b><span>步槍／狙擊槍・感染者・廢棄園區</span></button>
      </div>
      <button id="startButton" class="start-level" type="button" hidden>開始</button>
      <div id="levelGrid" class="level-grid" aria-label="選擇關卡"></div>
      <small>iPhone 會詢問動作與方向權限</small>
    </section>
  </main>
  <script type="module" src="src/game.js?v=flame1"></script>
</body>
</html>
